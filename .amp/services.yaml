services:
  web:
    command: >-
      php artisan optimize:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL"
      php artisan serve --host=0.0.0.0 --port="$PORT"
    health: /up
    portal:
      title: App
      description: Serves built assets from public/build. Run `pnpm run build` after frontend changes.
  queue:
    command: php artisan queue:listen --tries=1 --timeout=0
